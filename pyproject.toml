[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "docfgp"
version = "0.1.0"
description = "Generate deterministic fingerprints for documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["document", "fingerprint", "minhash", "pdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["pypdfium2>=4.30,<6", "Pillow>=10,<14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "psutil>=6", "reportlab>=4"]
benchmark = ["psutil>=6", "datasets>=3,<5"]

[project.scripts]
docfgp = "docfgp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docfgp"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.gitattributes", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213", "D413"]

[tool.mypy]
python_version = "3.11"
files = ["src/docfgp", "scripts"]
ignore_missing_imports = true
