[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"

[project]
name = "docfgp"
version = "0.1.1"
description = "DocFGP is a Python library that fingerprints documents to find duplicates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["document", "fingerprint", "minhash", "pdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["pypdfium2>=4.30,<6", "Pillow>=10,<14"]

[project.optional-dependencies]
benchmark = ["psutil>=6", "datasets>=3,<5"]

[project.scripts]
docfgp = "docfgp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "psutil>=6", "reportlab>=4"]

[tool.poetry.dependencies]
python = ">=3.11,<4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213", "D413"]

[tool.mypy]
python_version = "3.11"
files = ["src/docfgp", "scripts"]
ignore_missing_imports = true
